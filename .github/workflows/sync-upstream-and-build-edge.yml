name: Build upstream master edge

on:
  workflow_dispatch:
    inputs:
      force_edge:
        description: "Build edge even when upstream master has not changed."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "5 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-upstream-master-edge
  cancel-in-progress: false

jobs:
  resolve-upstream:
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}

    steps:
      - name: Resolve upstream master
        id: upstream
        run: |
          set -euo pipefail

          sha="$(git ls-remote --exit-code https://github.com/piotr-agier/google-drive-mcp.git refs/heads/master | awk '{print $1}')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha::12}" >> "$GITHUB_OUTPUT"

  build-edge:
    needs: resolve-upstream
    runs-on: ubuntu-latest

    steps:
      - name: Check out upstream master
        uses: actions/checkout@v5
        with:
          repository: piotr-agier/google-drive-mcp
          ref: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          path: upstream

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether edge image already exists
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:edge-${{ needs.resolve-upstream.outputs.short_sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Edge image already exists for ${{ needs.resolve-upstream.outputs.upstream_sha }}."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        working-directory: upstream
        run: npm ci

      - name: Lint
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        working-directory: upstream
        run: npm run lint

      - name: Build
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        working-directory: upstream
        run: npm run build

      - name: Test
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        working-directory: upstream
        run: npm test

      - name: Set image metadata
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=raw,value=edge-${{ needs.resolve-upstream.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ngojclee/google-drive-mcp
            org.opencontainers.image.revision=${{ needs.resolve-upstream.outputs.upstream_sha }}
            org.opencontainers.image.version=edge-${{ needs.resolve-upstream.outputs.short_sha }}

      - name: Build and publish edge image
        if: steps.image.outputs.exists != 'true' || inputs.force_edge == true
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
