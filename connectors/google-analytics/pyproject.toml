[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-connector"
version = "0.1.1"
description = "Google Analytics connector — Business MCP Hub → official analytics-mcp (GA4 Admin + Data APIs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "analytics-mcp==0.7.0",
  "google-analytics-admin==0.30.1",
  "mcp==1.28.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ga-connector = "ga_connector.__main__:main"

[tool.setuptools.packages.find]
include = ["ga_connector*"]
