name: Build fork hotfix (Gitea)

# Ported from .github/workflows/build-fork-hotfix.yml.
# Manual-only: builds THIS repo's master (LN hotfixes) into an immutable tag
# like 2.5.0-lnc.1 on the Gitea registry.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable Gitea registry tag for this tested fork build"
        required: true
        default: 2.5.0-lnc.1
        type: string

concurrency:
  group: gitea-fork-hotfix-${{ gitea.event.inputs.image_tag }}
  cancel-in-progress: false

env:
  REGISTRY: gitea.lengoc.me
  IMAGE: gitea.lengoc.me/automations/google-drive-mcp

jobs:
  build:
    runs-on: docker-build
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Install docker CLI
        run: |
          set -euo pipefail
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz -C /tmp --strip-components=1 docker/docker
          mv /tmp/docker /usr/local/bin/docker

      - name: Install, lint, build, test
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build
          npm test

      - name: Login to Gitea registry
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ gitea.actor }}" --password-stdin

      - name: Build and push immutable image
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            --label "org.opencontainers.image.version=${{ gitea.event.inputs.image_tag }}" \
            -t "${{ env.IMAGE }}:${{ gitea.event.inputs.image_tag }}" \
            .
          docker push "${{ env.IMAGE }}:${{ gitea.event.inputs.image_tag }}"
