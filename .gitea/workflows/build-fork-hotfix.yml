name: Build fork hotfix (Gitea)

# Ported from .github/workflows/build-fork-hotfix.yml.
# Manual-only: builds THIS repo's master (LN hotfixes) into an immutable tag
# like 2.5.0-lnc.1 on the Gitea registry.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable Gitea registry tag for this tested fork build"
        required: true
        default: 2.5.0-lnc.1
        type: string
      publish_latest:
        description: "Move lnc-latest only after server secrets and clients are ready"
        required: false
        default: false
        type: boolean

concurrency:
  group: gitea-lnc-publish
  cancel-in-progress: false

env:
  REGISTRY: gitea.lengoc.me
  IMAGE: gitea.lengoc.me/automations/google-drive-mcp
  NODE_OPTIONS: --max-old-space-size=2048

jobs:
  build:
    runs-on: docker-build
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Install docker CLI
        run: |
          set -euo pipefail
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz \
            | tar xz -C /tmp --strip-components=1 docker/docker
          mv /tmp/docker /usr/local/bin/docker

      - name: Install deps, lint, test and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run lint
          npm test

      - name: Login to Gitea registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u louis --password-stdin

      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ gitea.event.inputs.image_tag }}
          PUBLISH_LATEST: ${{ gitea.event.inputs.publish_latest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9][A-Za-z0-9_.-]{0,127}$ ]] || { echo "Invalid immutable tag" >&2; exit 1; }
          if docker manifest inspect "${{ env.IMAGE }}:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "Immutable tag already exists" >&2
            exit 1
          fi
          docker build \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            --label "org.opencontainers.image.version=$IMAGE_TAG" \
            -t "${{ env.IMAGE }}:$IMAGE_TAG" \
            .
          docker push "${{ env.IMAGE }}:$IMAGE_TAG"
          if [ "$PUBLISH_LATEST" = true ]; then
            docker tag "${{ env.IMAGE }}:$IMAGE_TAG" "${{ env.IMAGE }}:lnc-latest"
            docker push "${{ env.IMAGE }}:lnc-latest"
          fi
