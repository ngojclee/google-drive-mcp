services:
  google-analytics-connector:
    # Portainer Repository mode builds this source from canonical Gitea.
    # Do not add `image:` here: Portainer would attempt a registry pull first.
    build: .
    restart: unless-stopped
    environment:
      GA_MCP_BEARER_TOKEN: ${GA_MCP_BEARER_TOKEN:-}
      GA_HUB_DELEGATION_SECRET: ${GA_HUB_DELEGATION_SECRET:-}
      GA_HUB_AUDIENCE: ${GA_HUB_AUDIENCE:-google-analytics}
      GA_PRIVATE_MCP_URL: ${GA_PRIVATE_MCP_URL:-}
      GA_ALLOWED_HOSTS: ${GA_ALLOWED_HOSTS:-}
      GA_BIND_HOST: 0.0.0.0
      GA_BIND_PORT: 3050
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-analytics-service-account.json
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      MANAGEMENT_TOKEN: ${MANAGEMENT_TOKEN:-}
    volumes:
      - type: bind
        source: ${GA_SERVICE_ACCOUNT_PATH:-/home/Docker/google-analytics-connector/secrets/google-analytics-service-account.json}
        target: /run/secrets/google-analytics-service-account.json
        read_only: true
    expose:
      - "3050"
    # Nginx Proxy Manager (on the separate proxy host) reaches this LAN-only
    # port. Do not publish it to WAN/firewall rules.
    ports:
      - "${GA_HOST_PORT:-3444}:3050"
    networks:
      - app_internal
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3050/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  app_internal:
    internal: true
  proxy:
    external: true
    # Change to the existing Portainer reverse-proxy network name.
    name: CHANGE_ME_PROXY_NETWORK
