name: google-drive-mcp

services:
  google-drive-mcp:
    image: ${GOOGLE_MCP_IMAGE:-gitea.lengoc.me/apps/google-drive-mcp:lnc-latest}
    pull_policy: always
    container_name: google-drive-mcp
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: [start, --transport, http, --host, 0.0.0.0, --port, "3110", --no-resources]
    environment:
      NODE_ENV: production
      GOOGLE_DRIVE_OAUTH_CREDENTIALS: /config/gcp-oauth.keys.json
      GOOGLE_DRIVE_MCP_TOKEN_PATH: /config/tokens.json
      GOOGLE_DRIVE_MCP_SCOPES: ${GOOGLE_MCP_SCOPES:-drive.file,documents,spreadsheets,presentations,gmail.readonly}
      MCP_HTTP_BEARER_TOKEN_FILE: /config/mcp-http-bearer-token
      MCP_HTTP_ALLOWED_HOSTS: ${GOOGLE_MCP_ALLOWED_HOSTS:-10.21.4.101}
      MCP_ADMIN_KEY_FILE: ${GOOGLE_MCP_ADMIN_KEY_FILE:-}
      MCP_ADMIN_BOOTSTRAP_KEY: ${GOOGLE_MCP_ADMIN_BOOTSTRAP_KEY:-}
      MCP_ADMIN_KEY_STORE: ${GOOGLE_MCP_ADMIN_KEY_STORE:-}
      GOOGLE_DRIVE_MCP_AUTH_PORT: "3300"
    ports:
      - "10.21.4.101:3110:3110"
      - "127.0.0.1:3300-3304:3300-3304"
    volumes:
      - ${DATA_DIR:-/home/Docker}/google-drive-mcp/config:/config:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3110/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
