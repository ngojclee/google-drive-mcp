services:
  google-analytics-connector:
    image: ghcr.io/ngojclee/google-analytics-connector:${GA_CONNECTOR_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env/google-analytics-connector.env
    volumes:
      - type: bind
        source: /home/Docker/google-analytics-connector/secrets/google-analytics-service-account.json
        target: /run/secrets/google-analytics-service-account.json
        read_only: true
    expose:
      - "3050"
    networks:
      - app_internal
      - proxy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3050/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  app_internal:
    internal: true
  proxy:
    external: true
    # Change to the existing Portainer reverse-proxy network name.
    name: CHANGE_ME_PROXY_NETWORK
